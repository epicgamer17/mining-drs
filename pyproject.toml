[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mining_drs"
version = "0.1.0"
description = "A dynamic simulation engine for mining operations."
authors = [
    { name = "mining-drs Team" }
]
requires-python = ">=3.9"
dependencies = [
    "python-drs>=0.1.1",
    "pandas>=1.0",
    "numpy>=1.20",
    "matplotlib>=3.5",
    "rich>=13.0"
]

[project.optional-dependencies]
mining = ["gstools>=1.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark"
]
rl = [
    "torch>=2.0",
    "gymnasium>=0.28",
    "wandb",
    "tensordict",
    "einops",
    "rl-stuff"
]
all = ["mining_drs[mining,rl,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["drs_mining"]

[tool.coverage.run]
source = ["drs_mining"]
omit = [
    "tests/**",
    "examples/**",
    "**/__init__.py",
    "drs_mining/components/plot.py",
    "drs_mining/rl/**",
]

[tool.coverage.report]
omit = [
    "tests/**",
    "examples/**",
    "**/__init__.py",
    "drs_mining/components/plot.py",
    "drs_mining/rl/**",
]
