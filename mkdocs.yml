site_name: Mining-DRS
site_description: A dynamic simulation engine for mining operations.

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            filters:
              - "!^__(?!init|call|iter|next)" # Exclude magic methods EXCEPT init, call, iter, next
              # By not excluding single `_`, internal methods with docstrings will now render.

nav:
  - Home: index.md
  - Tutorials:
      - 1. Introduction to DRS: tutorials/01_introduction.md
      - 2. Advanced Core Dynamics & Guardrails: tutorials/02_advanced_dynamics.md
      - 3. Streaming Inputs & Data Sources: tutorials/03_data_streams.md
      - 4. Checkpointing & State Serialization: tutorials/04_serialization.md
      - 5. Telemetry & Custom Callbacks: tutorials/05_telemetry_callbacks.md
      - 6. Visualizing Module Graphs: tutorials/06_visualization.md
      - "7. Design Patterns: Operating Modes": tutorials/07_operating_modes.md
  - API Reference:
      - Engine: api/engine.md
      - Module: api/module.md
      - Variables: api/variables.md
      - Flow & Telemetry: api/flow_telemetry.md
      - Callbacks: api/callbacks.md
      - Configuration: api/config.md
      - Serialization: api/serialization.md
      - Exceptions: api/exceptions.md
      - Visualization: api/visualization.md
  - Roadmap: roadmap.md
